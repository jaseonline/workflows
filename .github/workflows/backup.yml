name: Cloudflare R2 Backup

# The caller owns the schedule
on:
  workflow_call:
    inputs:
      bucket:
        type: string
        default: github
      retention-days:
        type: string
        default: '90'
    secrets:
      CF_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The R2 action uploads an existing file; it doesn't create one. git archive packs the committed tree only
      # (no .git, nothing gitignored). The name comes from github.repository because scheduled runs have no
      # github.event.repository.
      - name: Create archive
        id: archive
        run: |
          file="${GITHUB_REPOSITORY#*/}_backup.tar.gz"
          git archive --format=tar.gz --prefix="${GITHUB_REPOSITORY#*/}/" -o "$file" HEAD
          ls -l "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: NX1X/Cloudflare-R2-backup-action@170cc1daf854595c704a781f4d1dbe506a2b9f15 # v1.0.0
        with:
          operation: upload
          account-id: ${{ secrets.CF_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ inputs.bucket }}
          file: ${{ steps.archive.outputs.file }}
          retention-days: ${{ inputs.retention-days }}
